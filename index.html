<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSNA / FSP Tool</title>
<style id="pageStyle">@page { size: letter portrait; margin: 0.5in; }</style>
<style>
/* Offline, single file. Nothing is saved or sent anywhere. Refreshing or closing clears everything. */
:root{--ink:#1c2530;--muted:#5b6673;--line:#d6dbe1;--bg:#f4f6f8;--card:#fff;--acc:#0f766e;--acc-soft:#e3f3f0;--warn:#b45309;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{min-height:100vh;display:flex;flex-direction:column}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;position:sticky;top:0;z-index:5}
.toprow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-weight:700}
.who{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;align-items:center}
.cg{display:flex;gap:2px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);font:600 11px/1 system-ui,sans-serif;min-width:22px;height:22px;padding:0 4px;border-radius:4px;cursor:pointer}
.chip.r{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.na{background:#8b95a1;border-color:#8b95a1;color:#fff}
.chip.cur{outline:2px solid #f59e0b;outline-offset:1px}
.chip.wide{padding:0 8px}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:20px 16px 120px;outline:none}
.crumb{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.crumb .pos{text-transform:none;letter-spacing:0}
h1.item{font-size:26px;margin:4px 0 8px}
h1.scr{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.desc{color:var(--muted);font-style:italic;margin:0 0 14px;font-size:15px}
.desc p{margin:0 0 6px}
.opt{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt .k{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 2px var(--acc) inset}
.opt.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
.opt .k.na{font-size:14px}
.cur-rating{font-size:14px;color:var(--muted);margin:0 0 8px}
.form{display:grid;grid-template-columns:200px minmax(180px,280px) 1fr;gap:10px 14px;align-items:center}
.form label{font-weight:600}
input[type=text],textarea{font:inherit;font-size:17px;padding:8px 10px;border:1px solid #b8c0c9;border-radius:6px;width:100%;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus,.prog:focus{outline:3px solid #f59e0b;outline-offset:1px;border-color:#f59e0b}
textarea{resize:vertical}
.help{font-size:14px;color:var(--muted)}
.help b{color:var(--ink)}
.help .warn{color:var(--warn);font-weight:600}
.hint{color:var(--muted);font-size:14px;margin-top:14px}
.stack{display:grid;gap:12px;max-width:760px}
.stack label{font-weight:600;display:block;margin-bottom:4px}
.ctx{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--muted);margin-bottom:14px;white-space:pre-wrap}
.prog{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px;border:1px solid #b8c0c9;border-radius:6px;background:#fff;width:max-content;max-width:100%}
.prog button{font:inherit;font-size:15px;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.prog button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-width:600px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){font-weight:600}
.printbtns{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 18px}
button.big{font:600 18px/1.2 system-ui,sans-serif;padding:16px 22px;border-radius:8px;border:2px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.big.alt{background:#fff;color:var(--acc)}
button.plain{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
button.danger{color:#b91c1c;border-color:#f0c4c4}
.navbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.summary{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.summary p{margin:4px 0}
footer.keys{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 16px 8px;font-size:13px;color:var(--muted);z-index:5}
.keyline{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
#status{text-align:center;font-size:13px;min-height:18px;color:var(--acc);font-weight:600}
#status.warn{color:var(--warn)}
kbd{display:inline-block;font:600 12px/1 ui-monospace,Consolas,monospace;border:1px solid #b8c0c9;border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:#f8fafb;color:var(--ink)}

/* ---------- print sheets (built only when you press a print button) ---------- */
#printRoot{position:absolute;left:-30000px;top:0}
.sheet{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}

#fsnaSheet{width:7.5in;font-family:Arial,Helvetica,sans-serif}
.fs-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin-bottom:5pt}
.fs-title{font-size:12pt;font-weight:700}
.fs-title span{font-weight:400;font-size:10pt}
.fs-frc{font-size:10pt}
.fs-meta{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:3pt 14pt;font-size:10pt;margin-bottom:8pt}
.fs-meta span{display:inline-block;color:#444;font-size:7.5pt;text-transform:uppercase;letter-spacing:.03em;margin-right:5pt}
.fs-meta b{font-weight:700}
.fitems{column-gap:18pt;column-rule:.5pt solid #bbb}
.fitems .sh{font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#333;border-bottom:.5pt solid #999;margin:7pt 0 3pt;padding-bottom:1pt;line-height:1.15}
.fitems .sh{margin-top:0}
.fitems .sec{padding-bottom:7pt}
.sec,.it{break-inside:avoid}
.fp1{height:9.85in;display:flex;flex-direction:column}
.ffoot{margin-top:auto;text-align:right;font-style:italic;font-size:10pt;border-top:.5pt solid #999;padding-top:3pt}
.fp2{break-before:page}
.it{display:flex;align-items:center;margin:.18em 0;white-space:nowrap}
.num{flex:0 0 auto;width:2em;height:2em;border:.1em solid #000;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.val{margin-left:.55em;font-weight:800;font-size:1.35em}
.val.na{font-size:1.1em}
.val.skip{font-weight:400;font-style:italic;color:#666;font-size:.85em}
.fs-notes{margin-top:6pt;border:1pt solid #000;padding:6pt 8pt;font-size:11pt}
.fs-notes .nl{font-weight:700;font-size:8pt;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2pt}
.fs-notes .nt{white-space:pre-wrap}
.none{font-style:italic;color:#555}

#fspSheet{width:10.2in;font-family:"Times New Roman",Times,serif;font-size:10.5pt}
.fsp-brand{font-family:Arial,Helvetica,sans-serif;font-weight:700;color:#1b6f8a;font-size:1.15em;margin-bottom:.35em}
table.fsp-head{width:100%;border-collapse:collapse;margin-bottom:.6em}
.fsp-head td{padding:.15em .3em;vertical-align:bottom}
.fsp-head td.l{font-weight:700;white-space:nowrap;width:1%}
.fsp-head td.v{border-bottom:.75pt solid #000}
.fsp-head td.cap{font-style:italic;font-weight:700;text-align:center;font-size:.9em;vertical-align:top}
table.fsp-dates,table.fsp-main{width:100%;border-collapse:collapse;border:1.5pt solid #000;table-layout:fixed}
.fsp-dates td{border:.75pt solid #000;padding:.2em .35em;height:1.9em;vertical-align:top}
.fsp-dates td.sh{background:#eee}
.fsp-main{margin-top:.7em}
.fsp-main td{border:.75pt solid #000;padding:.12em .35em;vertical-align:top;line-height:1.15}
.fsp-main tr.hd td{background:#d9d9d9}
.fsp-main tr.gh td{border-top:1.5pt solid #000;vertical-align:middle}
.fsp-main .c{text-align:center}
.fsp-main .u{text-decoration:underline}
.fsp-main .b{font-weight:700}
.fsp-main .txt{white-space:pre-wrap}
.fsp-main tr.vis td{height:2.8em}
.fsp-main tr.gb td{height:2.7em}
.fsp-main tr.pb td{height:1.9em}
.fsp-main .pc{white-space:nowrap;vertical-align:middle}
.cb{display:inline-block;width:.9em;height:.9em;border:.75pt solid #000;vertical-align:-.12em;text-align:center;line-height:.9em;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:.95em}
.fsp-next{font-weight:700;margin:.5em 0 0}
.fsp-next .dl{font-weight:400;font-style:italic;font-size:.9em;padding-left:22em}
.fsp-foot{font-style:italic;font-size:.75em;margin-top:.5em}

@media print{
  html,body{background:#fff}
  #app{display:none !important}
  #printRoot{position:static;left:auto}
  body:not(.p-fsna) #fsnaSheet{display:none}
  body:not(.p-fsp) #fspSheet{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="toprow"><span class="brand">FSNA / FSP</span><span class="who" id="who"></span></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="keys"><div id="status"></div><div class="keyline" id="keys"></div></footer>
</div>
<div id="printRoot"><div class="sheet" id="fsnaSheet"></div><div class="sheet" id="fspSheet"></div></div>

<script>
"use strict";
/* ===== Settings ===== */
const FRC = "Salem";
const CLINICIAN = "Mike Wilson";

/* ===== Form J items: [number, title, description, [0,1,2,3], N/A text or null] ===== */
const SECTIONS = [
 {g:"Family Status", name:"Household Status", items:[
  [1,"LANGUAGE","This item looks at whether the child and family need help to communicate with you or others in English. This item includes spoken, written, and sign language, as well as addresses issues of literacy.\n\nThis item should be rated without considering the child as an adequate interpreter. Interpreting for a parent may place a burden on a child and/or negatively impact the quality of care the child or family receives. If another adult family member serves as an interpreter in a behavioral health setting, the quality of this interpretation and confidentiality of the patient cannot be assured. Interpreting and written translation are complex skills. Trained and accredited interpreters and translators are impartial, confidential, and accountable to a code of ethics.\n\nSome families may have difficulty communicating due to issues beyond language difference, such as hearing issues or difficulty reading written English language. In addition, families may have difficulty understanding mental/behavioral health terminology. Issues such as these should be rated here.\n\nIf there are language differences between family members, this would also be rated in the Cultural Differences within a Family item.",
   ["No evidence that there is a need or preference for an interpreter or bilingual services and/or child and family speak, hear and read English.",
    "Child and/or family speak or read English, but potential communication problems exist because of limited vocabulary or comprehension of the nuances of the language.",
    "Child and/or significant family members possess only limited ability to speak and/or read English. While basic communication may be possible, a bilingual provider or interpreter is needed to assure that adequate communication is possible for extensive work.",
    "Child and/or significant family members do not speak English. A bilingual provider or interpreter is needed for all communications."], null],
  [2,"FINANCIAL STATUS","This item refers to the family's income (regardless of its source) in comparison to the family's financial needs (housing, clothing, utilities, etc.).",
   ["Family has financial resources necessary to meet needs.",
    "Family has financial resources necessary to meet most needs; however, some limitations exist.",
    "Family has financial difficulties that limit their ability to meet significant family needs.",
    "Family experiencing financial hardship, poverty."], null],
  [3,"FOOD SECURITY","This item refers to the family's current food security and hunger needs.",
   ["Family has sufficient resources to meet basic food needs without being supplemented by community resources.",
    "Family has sufficient resources to mostly meet basic food needs, using supplements from community resources.",
    "Family experiences frequent food insecurity. Some family members may cut the size of meals or skip meals because there is not enough money for food.",
    "Family has very low food security. Family is at risk of significant health and nutrition issues due to lack of food."], null],
  [4,"TRANSPORTATION","This item refers to the level of transportation required to ensure that the family could effectively participate in employment, treatment, and other related activities.",
   ["Family has no transportation needs.",
    "Family has occasional transportation needs. However, these can be met through existing natural supports.",
    "Family has occasional transportation needs that require a special vehicle, or family has frequent transportation needs (e.g., daily to work or therapy) that do not require a special vehicle. Family has no transportation options available to meet these needs. The lack of available transportation is putting employment and/or treatment success at risk.",
    "Family requires frequent (e.g., daily to work or therapy) that require a special vehicle and has no transportation options available to meet these needs. The lack of available transportation is putting employment and/or treatment success at risk."], null],
  [5,"CHILD CARE","This item refers to the level of access the family has to quality, affordable child care.",
   ["Quality, affordable child care is being used or child care is not needed.",
    "Child care is hard to find and afford, but family is able to provide care. Family has minor concerns about child care status, but is working towards a resolution.",
    "Family is rarely able to find or afford quality care. Family has several concerns about child care. Unreliable child care is putting employment and/or treatment success at risk.",
    "Family has need for child care, but no safe and affordable resources are available. Lack of child care is preventing parental growth/progress. Family must resort to using inappropriate child care."], null],
  [6,"MEDICAL CARE","This item refers to the level of access the family has to quality, affordable medical care. This should include the coverage and care of the medical, dental, vision, and mental health needs of the family.",
   ["Quality, affordable medical care is available and being used by all family members.",
    "Basic needs are met, but access to care is generally inadequate. One or more family members do not have adequate access to health care.",
    "Care received is inadequate. Lack of available care is putting employment, educational, and/or treatment success at risk.",
    "One or more family members health is endangered and medical problems are not being addressed."], null],
  [7,"RESIDENTIAL STABILITY","This item rates the family's current and likely future housing circumstances.",
   ["This rating indicates a family in stable housing with no known risks of instability.",
    "This rating indicates a family who is currently in stable housing but there are significant risks of housing disruption (e.g. loss of job).",
    "This rating indicates a family who has moved frequently or has very unstable housing.",
    "This rating indicates a family who is currently homeless."], null]
 ]},
 {g:"Family Status", name:"Family Strengths and Supports", items:[
  [8,"RELATIONS WITH EXTENDED FAMILY","This item refers to the family's relationship with other relatives who do not currently live with the family.",
   ["Extended family members play a central role in the functioning and well-being of the family. They have predominately positive relationships with members of the extended family and conflicts are resolved quickly.",
    "Extended family members play a supportive role in family functioning. They generally have positive relationships with members of the extended family. Conflicts may linger but eventually are resolved.",
    "Extended family members are marginally involved in the functioning and well-being of the family. They have generally strained or absent relationships with extended family members.",
    "Family is not in contact or estranged from extended family members. They have negative relationships with continuing conflicts."], null],
  [9,"NATURAL SUPPORTS","Natural supports refer to help that one does not have to pay for. This could include friends and families or a church or other organization that helps the family in times of need.",
   ["Family has substantial natural supports to assist in address most family and child needs.",
    "Family has natural supports but some limitations exist whereby these supports are insufficient to address some family and child needs.",
    "Family has limited natural supports.",
    "Family has no natural supports."], null],
  [10,"COMMUNITY INVOLVEMENT","Community is broadly defined as the people and institutions where the family lives. This could include a neighborhood, a city or town, or even a county. 'Community' is generally understood as the institutions that comprise it—businesses, churches, community centers, etc.",
   ["Family is actively involved in their community.",
    "Family is somewhat involved in their community. They are supportive of and involved in community institutions.",
    "Family identifies with a community but is not currently involved.",
    "Family is not involved with any community."], null],
  [11,"COMMUNITY ENVIRONMENT","This item refers to the family's perception of how safe they feel in the community in which they are currently living. This does not refer to feeling safe within their family or household, but refers to the larger neighborhood in which they live.",
   ["Family perceives their neighborhood and community to be safe and have no concerns regarding safety in their community.",
    "Family perceives their neighborhood to somewhat safe most of the time, but express occasional concerns.",
    "Family perceives their community to be safe only about half the time, and worries about the family's safety in the community.",
    "Family perceives their community to be unsafe most of the time and expresses significant concern about the family's safety in their current living situation."], null],
  [12,"CULTURAL IDENTITY","Cultural identity refers to the family's view of themselves as belonging to a specific cultural group. This cultural group may be defined by a number of factors, including race, religion, ethnicity, geography, or lifestyle.",
   ["Family has clear and consistent cultural identity and is connected to others who share this cultural identity.",
    "Family is experiencing some confusion or concern regarding cultural identity.",
    "Family has significant struggles with own cultural identity. Family may have cultural identity but is not connected with others who share this culture.",
    "Family has no cultural identity or is experiencing significant problems due to conflict regarding cultural identity."], null],
  [13,"CULTURAL PRACTICE","Cultural practice includes activities and traditions that are culturally centered, including tribal events and the celebration of culturally specific holidays, such as Rosh Hashanah and Kwanzaa. These rituals may also include daily activities that are culturally specific (e.g., praying toward Mecca at specific times, eating a specific diet, access to media).",
   ["Family is consistently able to practice traditions and activities consistent with their cultural identity.",
    "Family is generally able to practice traditions and activities consistent with their cultural identity; however, they sometimes experience some obstacles to the performance of these traditions.",
    "Family experience significant barriers and are sometimes prevented from practicing traditions and activities consistent with their cultural identity.",
    "Family is unable to practice traditions and activities consistent with their cultural identity."], null],
  [14,"CULTURAL DIFFERENCES WITHIN A FAMILY","Sometimes individual members within a family have different backgrounds, values and/or perspectives. In many cases, this may not cause any difficulties in the family as they are able to communicate about their differences, but for others it may cause conflict, stress, or disengagement between family members and impact the child's functioning. This might occur in a family where a child is adopted from a different race, culture, ethnicity, or socioeconomic status. The parent may struggle to understand or lack awareness of the child's experience of discrimination. Additionally this may occur in families where the parents are first generation immigrants to the United States. The youth may refuse to adhere to certain cultural practices, choosing instead to participate more in popular US culture.",
   ["No evidence of conflict, stress or disengagement within the family due to cultural differences or family is able to communicate effectively in this area.",
    "Child and family have struggled with cultural differences in the past, but are currently managing them well or there are mild issues of disagreement.",
    "Child and family experience difficulties managing cultural differences within the family which negatively impacts the functioning of the child.",
    "Child and family experience such significant difficulty managing cultural differences within the family that it interferes with the child's functioning and/or requires immediate action."], null]
 ]},
 {g:"Family Status", name:"Family Relationships", items:[
  [15,"PARENTAL/CAREGIVER COLLABORATION","This item refers to the relationship between parents (or other primary caregivers) with regard to working together in child-rearing activities. This includes the relationship between divorced parents with shared custody.",
   ["Adaptive collaboration. Parents/caregivers usually work together regarding issues of development and well-being of the children. They are able to negotiate disagreements related to their children.",
    "Mostly adaptive collaboration. Generally good parental collaboration with occasional difficulties negotiating miscommunications or misunderstanding regarding issues of the development and well-being of the children.",
    "Limited adaptive collaboration. Moderate problems of communication and collaboration between two or more adult parents/caregivers with regard to issues of the development and well-being of the children.",
    "Significant difficulties with collaboration. Minimal collaboration and destructive or sabotaging communication among any parents/caregivers regarding issues related to the development and well-being of the children."],
   "Not applicable. Single parents/caregiver with no partner or co-parent."],
  [16,"RELATIONSHIPS AMONG SIBLINGS","This item refers to how the children in the family (brothers and sisters, adopted siblings, as well as step- and half-siblings) get along with each other.",
   ["Adaptive relationships. Siblings generally get along well. Occasional fights or conflicts between them occur, but are quickly resolved.",
    "Mostly adaptive relationships. Siblings generally get along, however, when fights or conflicts arise there is some difficulty in resolving them.",
    "Limited adaptive relationships. Siblings often do not get along. They generally attempt to resolve their fights or conflicts but have limited success in doing so.",
    "Significant difficulties with relationships. Siblings do not get along. The relationships are marked by detachment or active, continuing conflicts, and may include physical violence."],
   "Not applicable."],
  [17,"FAMILY CONFLICT","This item refers to how much fighting occurs between family members. Domestic violence refers to physical fighting in which family members might get hurt.",
   ["Minimal conflict. Family gets along well and negotiates disagreements appropriately.",
    "Some conflict. Family generally gets along fairly well but when conflicts arise resolution is difficult.",
    "Significant conflict. Family is generally argumentative and conflict is a fairly constant theme in family communications.",
    "Domestic violence. Threats or occurrence of physical, verbal, or emotional altercations. Family with current restraining order against one member would be rated here."], null],
  [18,"FAMILY ROLE APPROPRIATENESS","Boundaries refer to the ability of family members to separate themselves as individuals and appropriately separate communication with various family members. Hierarchies refer to the organization of decision-making authority in the family.",
   ["Adaptive boundaries. Family has strong appropriate boundaries among members. Clear inter-generational hierarchies are maintained.",
    "Mostly adaptive boundaries. Family has generally appropriate boundaries and hierarchies. May experience some minor blurring of roles.",
    "Limited adaptive boundaries. Family has difficulty maintaining appropriate boundaries and/or hierarchies. Some significant role problems exist.",
    "Significant difficulties with boundaries. Family has significant problems with establishing and maintaining reasonable boundaries and hierarchies. Significant role confusion or reversals may exist."], null]
 ]},
 {g:"Parenting Team Status", name:"Parenting Team Status", items:[
  [19,"UNDERSTANDING OF YOUTH'S NEEDS","This item refers to the parent's/caregiver's level of understanding of their children's needs, as well as their motivation for learning more.",
   ["Parents/Caregivers appear to have a good understanding of their children's needs, and appear motivated to learn more about their needs.",
    "Parents/Caregivers appear to have some understanding of their children's needs, but appear to be motivated to learn more about their needs.",
    "Parents/Caregivers appear to have a poor understanding of their children's needs and their motivation to learn more seems unclear.",
    "Parents/Caregivers appear to have little to no understanding of their children's needs and appear to have little motivation to learn more about their needs."], null],
  [20,"ABILITY TO COMMUNICATE","This item describes the parents/caregivers' ability to articulate in an understandable way their thoughts, feelings, beliefs, and concerns regarding parenting and children's needs and strengths.",
   ["Parents/caregivers are able to express feeling and thoughts effectively with regard to family and child issues.",
    "Parents/caregivers are able to express feeling and thoughts but sometimes struggle to express these so that others can listen and/or understand.",
    "Parents/caregivers require help learning to express feelings and thoughts effectively with regard to family and child issues.",
    "Parents/caregivers require substantial help learning to express feelings and thoughts effectively with regard to family and child issues."], null],
  [21,"KNOWLEDGE OF SERVICE AND SUPPORTS OPTIONS","This item refers to the family's knowledge of choices they might have for specific treatments, interventions or other services and support needs and options that might help the family address their needs or the needs of one of the family's members. A family with a child having special needs (e.g., hearing-impaired, medically complex, developmental disability, etc.) may also be included here.",
   ["Parents/caregivers have strong understanding of service and support needs and options.",
    "Parents/caregivers have understanding of service and support needs and options but may still require some help in learning about certain aspects of these services.",
    "Parents/caregivers require assistance in understanding service and support needs and options.",
    "Parents/caregivers require substantial assistance in identifying and understanding service and support needs and options."], null],
  [22,"INVOLVEMENT WITH CARE","This rating should be based on the level of involvement the parents/caregivers have in the planning and provision of services.",
   ["Parents/caregivers are actively involved in the planning and/or implementation of services and are able to be effective advocates on behalf of the child or adolescent.",
    "Parents/caregivers are consistently involved in the planning and/or implementation of services for the child or adolescent but are not active advocates on behalf of the child or adolescent.",

/* ===== State (memory only) ===== */
function blankState(){
  return {intake:"", fsna:"", youth:"", family:"", dob:"", r:{}, notes:"", vision:"",
          goals:[0,1,2,3].map(() => ({text:"", who:"", prog:""}))};
}
let S = blankState();
let pos = 0, fromPrint = PRINT - 1;

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
function parseDate(raw){
  let s = String(raw || "").trim().toLowerCase();
  if (!s) return null;
  const now = new Date();
  if (s === "t" || s === "today") return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let m, d, y;
  if (/^\d+$/.test(s)) {
    if (s.length === 4) { m = +s.slice(0,2); d = +s.slice(2,4); y = now.getFullYear(); }
    else if (s.length === 6 || s.length === 8) { m = +s.slice(0,2); d = +s.slice(2,4); y = +s.slice(4); }
    else return null;
  } else {
    const p = s.split(/[\/\-\.\s]+/).filter(Boolean);
    if (p.some(x => !/^\d+$/.test(x))) return null;
    if (p.length === 3 && p[0].length === 4) { y = +p[0]; m = +p[1]; d = +p[2]; }
    else if (p.length === 3) { if (p[2].length !== 2 && p[2].length !== 4) return null; m = +p[0]; d = +p[1]; y = +p[2]; }
    else if (p.length === 2) { m = +p[0]; d = +p[1]; y = now.getFullYear(); }
    else return null;
  }
  if (y < 100) { y += 2000; if (y > now.getFullYear() + 1) y -= 100; }
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}
const addDays = (dt, n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const fmt = dt => dt ? `${pad(dt.getMonth()+1)}/${pad(dt.getDate())}/${dt.getFullYear()}` : "";
const fmtLong = dt => dt ? dt.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric", year:"numeric"}) : "";
function ageOn(b, ref){
  let a = ref.getFullYear() - b.getFullYear();
  if (ref.getMonth() < b.getMonth() || (ref.getMonth() === b.getMonth() && ref.getDate() < b.getDate())) a--;
  return a;
}
function dates(){
  const i = parseDate(S.intake), f = parseDate(S.fsna), b = parseDate(S.dob);
  return {i, f, b, i30: i ? addDays(i, 30) : null, plan: f ? addDays(f, 1) : null};
}
const rText = v => v === undefined ? "skip" : (v === "NA" ? "N/A" : String(v));
function hasData(){
  return !!(S.intake || S.fsna || S.youth || S.family || S.dob || Object.keys(S.r).length || S.notes.trim() ||
            S.vision.trim() || S.goals.some(g => g.text.trim() || g.who.trim()));
}
let statusTimer;
function status(msg, warn){
  const el = $("#status"); el.textContent = msg; el.className = warn ? "warn" : "";
  clearTimeout(statusTimer); statusTimer = setTimeout(() => { el.textContent = ""; }, 4000);
}
function setR(n, v){
  S.r[n] = v;
  status(`#${n} ${ITEM[n].t} → ${v === "NA" ? "N/A" : v}`);
}

/* ===== Navigation ===== */
function go(i){
  i = Math.max(0, Math.min(SCREENS.length - 1, i));
  if (i === PRINT && pos !== PRINT) fromPrint = pos;
  pos = i; render();
}
const next = () => go(pos + 1);
const prev = () => go(pos - 1);
function nextSection(n){
  const s = SEC_OF[n], ns = SECTIONS[s.idx + 1];
  go(ns ? ns.items[0].n : NOTES);
}
function prevSection(n){
  const s = SEC_OF[n];
  if (n !== s.items[0].n) return go(s.items[0].n);
  const ps = SECTIONS[s.idx - 1];
  go(ps ? ps.items[0].n : 0);
}

/* --- Chained text fields: Enter/Tab forward, Shift+Tab back --- */
function wireChain(els, opts = {}){
  els.forEach((el, i) => {
    el.addEventListener("keydown", e => {
      const isTA = el.tagName === "TEXTAREA";
      if (e.key === "Escape" && opts.esc) { e.preventDefault(); opts.esc(); return; }
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); next(); return; }
      if (e.key === "Enter" && !e.shiftKey && !(isTA && opts.enterNewline)) {
        e.preventDefault();
        if (opts.onEnter && opts.onEnter(el, i)) return;
        if (i < els.length - 1) els[i+1].focus(); else next();
        return;
      }
      if (e.key === "Tab" && !e.shiftKey && i === els.length - 1) { e.preventDefault(); next(); return; }
      if (e.key === "Tab" && e.shiftKey && i === 0) { e.preventDefault(); prev(); return; }
    });
  });
}
function focusEnd(el){ el.focus(); if (el.setSelectionRange) { const L = el.value.length; el.setSelectionRange(L, L); } }

  h += `<div class="desc">${it.d.split("\n\n").map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
  it.r.forEach((txt, i) => {
    h += `<div class="opt ${cur===i?"sel":""}" data-v="${i}"><div class="k">${i}</div><div>${esc(txt)}</div></div>`;

  if (it.na) h += `<div class="opt ${cur==="NA"?"sel":""}" data-v="NA"><div class="k na">4</div><div><b>N/A</b> — ${esc(it.na)}</div></div>`;

  main.focus({preventScroll:true});
  keys([`${kb("0")}–${kb("3")} rate`, it.na ? `${kb("4")} N/A` : `<span style="opacity:.5">${kb("4")} N/A (not on this item)</span>`,
        `${kb("→")} / ${kb("Space")} skip`, `${kb("←")} back`, `${kb("Enter")} next section`,
        `${kb("Shift")}+${kb("Enter")} prev section`, `${kb("C")} child section (39)`, `${kb("Del")} clear rating`]);
}
function itemKey(e, n){
  const k = e.key;
  if (e.repeat && /^[0-4]$/.test(k)) { e.preventDefault(); return; }   // holding a number key won't rate a run of items
  if (/^[0-3]$/.test(k)) { e.preventDefault(); setR(n, +k); next(); return; }
  if (k === "4") {
    e.preventDefault();
    if (ITEM[n].na) { setR(n, "NA"); next(); } else status(`Item ${n} has no N/A option`, true);
    return;
  }
  if (k === "ArrowRight" || k === " " || k === "Spacebar") {
    e.preventDefault(); if (S.r[n] === undefined) status(`#${n} skipped`); next(); return;
  }
  if (k === "ArrowLeft") { e.preventDefault(); prev(); return; }
  if (k === "Enter") { e.preventDefault(); e.shiftKey ? prevSection(n) : nextSection(n); return; }
  if (k === "c" || k === "C") { e.preventDefault(); go(CHILD_START); return; }
  if (k === "Backspace" || k === "Delete") { e.preventDefault(); delete S.r[n]; status(`#${n} cleared`); render(); return; }
}

/* ===== Global keys (only when not typing in a box) ===== */
document.addEventListener("keydown", e => {
  if (e.defaultPrevented) return;      // already handled by a text box (e.g. Enter that moved to the next screen)
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.classList.contains("prog"))) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const sc = SCREENS[pos];
  if (sc.type === "item") return itemKey(e, sc.n);
  const k = e.key;
  if (sc.type === "fspIntro") {
    if (k === "Enter" || k === "ArrowRight" || k === " ") { e.preventDefault(); next(); }
    else if (k === "s" || k === "S" || k === "Escape") { e.preventDefault(); go(PRINT); }
    else if (k === "ArrowLeft") { e.preventDefault(); prev(); }
    return;
  }
  if (sc.type === "print") {
    if (k === "f" || k === "F") { e.preventDefault(); doPrint("fsna"); }
    else if (k === "p" || k === "P") { e.preventDefault(); doPrint("fsp"); }
    else if (k === "ArrowLeft") { e.preventDefault(); go(fromPrint); }
    return;
  }
  // Text screens where focus slipped off the box: Enter puts you back in it
  if (k === "Enter") { const f = main.querySelector("input,textarea"); if (f) { e.preventDefault(); focusEnd(f); } }
});

// True when every section sits whole in one column and nothing spills past the page width.
function sectionsWhole(items){
  const box = items.getBoundingClientRect();
  for (const sec of items.querySelectorAll(".sec")) {
    const rows = sec.querySelectorAll(".sh,.it");
    const L = rows[0].getBoundingClientRect().left;
    for (const r of rows) {
      const rc = r.getBoundingClientRect();
      if (Math.abs(rc.left - L) > 2 || rc.right > box.right + 2) return false;
    }
  }
  return true;
}
function fitFSNA(){
  const sheet = $("#fsnaSheet"), items = sheet.querySelector(".fitems");
  if (!items) return;
  const body = sheet.querySelector(".fbody"), foot = sheet.querySelector(".ffoot");
  const maxH = 9.85 * 96 * 0.98;     // page-1 box (inside 0.5in margins)
  const used = () => body.offsetHeight + (foot ? foot.offsetHeight + 8 : 0);
  const ok = () => used() <= maxH && sectionsWhole(items);
  const MIN = 0.5, MAX = 2.0;       // ×10pt; one size for every number on the page
  let best = null;
  for (const c of [2, 3, 4, 5]) {
    const colPt = (540 - (c - 1) * 18) / c;           // 7.5in = 540pt
    const hiW = Math.min(MAX, colPt / 54);             // a row needs ~5.4em of width
    items.style.columnCount = c;
    items.style.fontSize = (MIN * 10) + "pt";
    if (!ok()) continue;
    let lo = MIN, hi = hiW;
    items.style.fontSize = (hi * 10) + "pt";
    if (ok()) lo = hi;
    else for (let k = 0; k < 14; k++) {
      const mid = (lo + hi) / 2;
      items.style.fontSize = (mid * 10) + "pt";
      if (ok()) lo = mid; else hi = mid;
    }
    if (!best || lo > best.s + 0.01) best = {s: lo, c};
  }
  if (!best) best = {s: MIN, c: 5};
  items.style.columnCount = best.c;
  items.style.fontSize = (best.s * 10) + "pt";
}

const cb = on => `<span class="cb">${on ? "X" : ""}</span>`;
const progCell = p => PROGS.map(x => `${cb(p === x)} ${x}`).join("&emsp;&ensp;");
function buildFSP(){
  const d = dates();
  const reviewed = Array(5).fill(`<td class="sh"><b>Reviewed on:</b></td>`).join("");
  const updated = Array(5).fill(`<td class="sh"><b>Updated by:</b></td>`).join("");
  let h = `<div class="fsp-brand">Family Resource Centers</div>
  <table class="fsp-head">
    <colgroup><col style="width:1%"><col style="width:26%"><col style="width:1%"><col style="width:30%"><col style="width:1%"><col></colgroup>
    <tr><td class="l">FAMILY'S NAME:</td><td class="v">${esc(S.family)}</td><td class="l">YOUTH'S NAME:</td><td class="v">${esc(S.youth)}</td><td class="l">Family ID</td><td class="v"></td></tr>
    <tr><td colspan="2" class="v" style="text-align:center">${esc(FRC)}</td><td class="l">YOUTH'S DOB:</td><td class="v">${fmt(d.b) || esc(S.dob)}</td><td class="l">Family Member ID:</td><td class="v"></td></tr>
    <tr><td colspan="2" class="cap">(Name of FRC)</td><td colspan="4"></td></tr>
  </table>
  <table class="fsp-dates">
    <tr><td><b>Original Date of this plan:</b> ${fmt(d.plan)}</td>${reviewed}</tr>
    <tr><td><b>Completed by:</b> ${esc(CLINICIAN)}</td>${updated}</tr>
  </table>
  <table class="fsp-main">
    <colgroup><col style="width:7%"><col style="width:43%"><col style="width:18%"><col style="width:32%"></colgroup>
    <tr class="hd"><td class="b u">No.</td><td colspan="3"><b>Vision/Need of Family</b> (<i>Describe specific improvement if need is addressed</i>)</td></tr>
    <tr class="vis"><td class="b">Vision</td><td colspan="3" class="txt">${esc(S.vision.trim())}</td></tr>`;
  S.goals.forEach((G, i) => {
    h += `
    <tr class="gh"><td class="c b u">Goal #</td><td class="b">What will be done to help family achieve the vision/need?<br><i>(if referring to a service, please note how it is hoped the service will help)</i></td><td class="b u">Person(s) Responsible</td><td class="b u">Progress</td></tr>
    <tr class="gb"><td class="c">${i+1}</td><td class="txt">${esc(G.text.trim())}</td><td class="txt">${esc(G.who.trim())}</td><td class="pc">${progCell(G.prog)}</td></tr>
    <tr class="pr"><td colspan="2" class="b">Progress / Review of Goals</td><td colspan="2" class="b">Accomplishment / Progress / Barriers for this Goal</td></tr>
    <tr class="pb"><td class="c">Date</td><td class="pc">${progCell("")}</td><td colspan="2"></td></tr>`;
  });
  h += `</table>
  <p class="fsp-next">This Plan will be reviewed next on: ______________________ (all Family Support Plans should be reviewed every ______ weeks).<br><span class="dl">(Date)</span></p>
  <div class="fsp-foot">Form K - Family Support Plan</div>`;
  $("#fspSheet").innerHTML = h;
}
function fitFSP(){
  const sheet = $("#fspSheet");
  const maxH = 7.7 * 96 * 0.97;     // 8.5in landscape height − 2 × 0.4in margins
  let lo = 6.5, hi = 10.5;
  sheet.style.fontSize = hi + "pt";
  if (sheet.offsetHeight <= maxH) return;
  for (let k = 0; k < 12; k++) {
    const mid = (lo + hi) / 2;
    sheet.style.fontSize = mid + "pt";
    if (sheet.offsetHeight <= maxH) lo = mid; else hi = mid;
  }
  sheet.style.fontSize = lo + "pt";
}

function doPrint(which){
  if (which === "fsna") { buildFSNA(); fitFSNA(); $("#pageStyle").textContent = "@page { size: letter portrait; margin: 0.5in; }"; }
  else { buildFSP(); fitFSP(); $("#pageStyle").textContent = "@page { size: letter landscape; margin: 0.4in; }"; }
  document.body.classList.remove("p-fsna", "p-fsp");
  document.body.classList.add("p-" + which);
  window.print();
}
window.addEventListener("afterprint", () => document.body.classList.remove("p-fsna", "p-fsp"));
window.addEventListener("beforeunload", e => { if (hasData()) { e.preventDefault(); e.returnValue = ""; } });

render();
</script>
</body>
</html>
